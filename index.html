<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
        <meta charset="UTF-8">
        <title>乒乓球平衡系統</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: "Lobster", Arial, cursive;
                text-align: center;
                background-color:#ffffff;
            }
                /*展示區*/
            #simulationBox {
                width: 100vw;
                height: 100vh;
                position: absolute;
                top: 0;
                left: 0;
                margin: 0;
                padding: 0;
                border: 4px solid #ffffff;
                border-radius: 12px;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <h1>乒乓球平衡系統</h1>
        <div id="simulationBox">
        </div>
        <script>    
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera); 
                directionalLight.position.copy(camera.position);
                controls.update();
            }
            /*容器*/
            const container = document.getElementById('simulationBox');
            /*新畫面*/
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#5B5B5B');
            const camera = new THREE.PerspectiveCamera(75,container.clientWidth / container.clientHeight,0.1,1000);
            camera.position.z = 5;
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            const loader = new THREE.GLTFLoader();
            /*匯入模型*/
            loader.load(
                'model.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(10, 10, 10); /* 放大模型 */

                    // 走訪零件並變更材質顏色
                    model.traverse(function (child) {
                        if (child.isMesh && child.material) {
                            child.material.color.set('#2DFF00'); // 修改顏色

                        }
                    });

                    scene.add(model); /* 成功加入場景 */
                },
                undefined,
                function (error) {
                    console.error('模型載入發生錯誤：', error);
                }
            );
            const controls = new THREE.OrbitControls(camera, renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
            directionalLight.position.set(5,10, 7.5);

            scene.add(directionalLight);
            animate();
        </script>
    </body>
</html>
